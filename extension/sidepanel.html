<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        background: #fff;
        color: #1a1a1a;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 12px 14px 10px;
        border-bottom: 1px solid #e5e5e5;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #111;
        margin-bottom: 4px;
      }

      #tab-info {
        font-size: 11px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 10px;
      }

      .tab {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border: none;
        background: none;
        color: #888;
        cursor: pointer;
        border-radius: 4px;
      }

      .tab:hover { background: #f4f4f4; }

      .tab.active {
        color: #111;
        background: #eef2ff;
        font-weight: 600;
      }

      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .view.hidden { display: none; }

      #log, #logs {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }

      .logs-toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid #f0f0f0;
      }

      .logs-toolbar select {
        font: inherit;
        font-size: 11px;
        padding: 2px 4px;
      }

      .logs-toolbar button {
        font: inherit;
        font-size: 11px;
        padding: 2px 8px;
        border: 1px solid #e0e0e0;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        margin-left: auto;
      }

      .logs-toolbar button:hover { background: #f4f4f4; }

      .log-entry {
        display: flex;
        gap: 8px;
        padding: 4px 14px;
        border-bottom: 1px solid #f4f4f4;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 11px;
        line-height: 1.4;
      }

      .log-entry .log-time {
        flex-shrink: 0;
        color: #bbb;
      }

      .log-entry .log-level {
        flex-shrink: 0;
        text-transform: uppercase;
        font-size: 9px;
        font-weight: 600;
        padding: 1px 4px;
        border-radius: 3px;
        align-self: flex-start;
        margin-top: 1px;
      }

      .log-entry .log-source {
        flex-shrink: 0;
        color: #aaa;
      }

      .log-entry .log-message {
        flex: 1;
        min-width: 0;
        word-break: break-word;
        white-space: pre-wrap;
        color: #333;
      }

      .level-info .log-level { background: #eef2ff; color: #4f46e5; }
      .level-warn .log-level { background: #fef3c7; color: #b45309; }
      .level-error .log-level { background: #fee2e2; color: #dc2626; }
      .level-error .log-message { color: #dc2626; }

      .empty {
        padding: 24px 14px;
        color: #aaa;
        font-size: 12px;
      }

      .entry {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 6px 14px;
        border-bottom: 1px solid #f0f0f0;
      }

      .entry:last-child { border-bottom: none; }

      .status-icon {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        margin-top: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }

      .status-start .status-icon { color: #888; }
      .status-done .status-icon { color: #16a34a; }
      .status-error .status-icon { color: #dc2626; }

      .entry-body { flex: 1; min-width: 0; }

      .command-name {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 500;
        color: #2563eb;
      }

      .status-error .command-name { color: #dc2626; }

      .command-detail {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .error-msg {
        font-size: 11px;
        color: #dc2626;
        margin-top: 2px;
        word-break: break-word;
      }

      .timestamp {
        flex-shrink: 0;
        font-size: 10px;
        color: #bbb;
        margin-top: 2px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      .spinning { display: inline-block; animation: spin 0.8s linear infinite; }
    </style>
  </head>
  <body>
    <header>
      <h1>brow-use</h1>
      <div id="tab-info">No active tab</div>
      <nav class="tabs">
        <button id="tab-activity" class="tab active">Activity</button>
        <button id="tab-logs" class="tab">Logs</button>
      </nav>
    </header>
    <div id="activity-view" class="view">
      <div id="log"><div class="empty">No commands yet for this tab.</div></div>
    </div>
    <div id="logs-view" class="view hidden">
      <div class="logs-toolbar">
        <select id="log-level">
          <option value="all">All levels</option>
          <option value="info">Info &amp; up</option>
          <option value="warn">Warn &amp; up</option>
          <option value="error">Errors only</option>
        </select>
        <button id="log-clear">Clear</button>
      </div>
      <div id="logs"><div class="empty">No logs yet.</div></div>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
